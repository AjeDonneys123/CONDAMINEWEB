<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plateforme Condamine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <button id="backToMenuBtn" style="display:none; padding:8px 15px; background:white; border:1px solid #ccc; border-radius:8px;">← Menu</button>
      <h1>Condamine</h1>
    </div>
    <div class="header-right"> 
      <button id="myMistakesBtn" style="display:none; background:#f472b6; color:white; padding:8px 15px; border-radius:8px;">📝 Fautes</button>
      <button id="backToProfBtn" style="display: none; background-color: #f59e0b; color:white; padding:8px 15px; border-radius:8px;">🎓 Prof</button>
      <div id="studentBadge" style="font-weight:bold; display:none; color:#334155;"></div>
      <button id="logoutBtn" style="display: none; padding:8px 15px; background:#eee; border-radius:8px;">Déconnexion</button>
    </div>
  </header>

  <main class="wrap">
    <div id="main-content">
        <!-- Zone d'injection dynamique -->
        <section id="registerCard" class="card">
          <h2>👋 Connexion</h2>
          <form id="registerForm">
            <input id="firstName" placeholder="Prénom" required style="margin-bottom:10px; padding:12px; width:100%; border-radius:8px; border:1px solid #ddd;">
            <input id="lastName" placeholder="Nom" required style="margin-bottom:10px; padding:12px; width:100%; border-radius:8px; border:1px solid #ddd;">
            <select id="classroom" style="margin-bottom:10px; padding:12px; width:100%; border-radius:8px; border:1px solid #ddd;">
                <option value="6D">6eD</option><option value="5B">5eB</option><option value="5C">5eC</option>
                <option value="2A">2de A</option><option value="2CD">2de CD</option>
            </select>
            <button type="submit" class="action-btn" style="width:100%; padding:12px; background:#2563eb; color:white; border-radius:8px; font-weight:bold;">Entrer</button>
          </form>
          <div id="profPasswordModal" style="display:none; margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
               <input type="password" id="profPassword" placeholder="Mot de passe prof" style="padding:12px; margin-bottom:10px; width:100%; border-radius:8px; border:1px solid #ddd;">
               <button id="validateProfPasswordBtn" class="action-btn" style="background:#f59e0b; width:100%; padding:12px; color:white; border-radius:8px; font-weight:bold;">Valider</button>
          </div>
        </section>
    </div>
  </main>

  <div id="mistakesModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <button id="closeMistakesBtn" style="position:absolute; top:15px; right:15px;">✕</button>
          <h3>Mon carnet de fautes</h3>
          <div id="mistakesList"></div>
      </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
