<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CondaWeb Élève</title>
  <style>
    body{width:330px;margin:0;padding:18px;background:#f8fafc;color:#0f172a;font:14px system-ui}h1{font-size:19px;margin:0 0 5px}.hint{color:#64748b;font-size:12px;line-height:1.4}.card{margin-top:14px;padding:13px;border:1px solid #cbd5e1;border-radius:14px;background:white}.status{margin:8px 0;font-weight:700;color:#475569}button{width:100%;border:0;border-radius:11px;padding:11px;font-weight:800;cursor:pointer}.folder{background:#e0f2fe;color:#075985}.capture{margin-top:9px;background:#2563eb;color:white}.shortcut{margin-top:12px;text-align:center;font-size:12px;color:#475569}kbd{background:#e2e8f0;border-radius:5px;padding:2px 5px}
  </style>
</head>
<body>
  <h1>🧩 CondaWeb Élève</h1>
  <div class="hint">Capture une zone de l’écran et enregistre-la dans le dossier choisi.</div>
  <div class="card">
    <button id="folder" class="folder">📁 Choisir le dossier des captures</button>
    <div id="status" class="status">Aucun dossier choisi.</div>
    <button id="capture" class="capture">✂️ Capturer une zone</button>
    <div class="shortcut">Windows : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>S</kbd><br>Mac : <kbd>⌘</kbd>+<kbd>Maj</kbd>+<kbd>S</kbd></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
