<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGmini Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="panel">
      <div class="kicker">ChatGmini</div>
      <h1>Cockpit Gemini</h1>
      <p class="hint">
        Ce panneau ne tente plus d'embarquer Gemini. Il pilote le moteur Gemini ouvert ailleurs et affiche son dernier etat.
      </p>

      <div class="card">
        <div class="card-title">Etat moteur</div>
        <pre id="status" class="status">Chargement...</pre>
      </div>

      <div class="card">
        <div class="card-title">Derniere reponse</div>
        <div id="response" class="response">Aucune reponse capturee pour l'instant.</div>
      </div>

      <div class="actions">
        <button id="openGemini" class="cta">Ouvrir / retrouver Gemini</button>
        <button id="refreshState" class="ghost">Actualiser l'etat</button>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
